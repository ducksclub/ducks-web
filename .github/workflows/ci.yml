name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        env:
          NUXT_PRIVATE_API_BASE: http://127.0.0.1:3001/api
          NUXT_PUBLIC_API_BASE: /api
          NUXT_PUBLIC_SITE_URL: http://localhost:3000
        run: yarn build
